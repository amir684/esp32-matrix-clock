<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0f14">
<title>שעון מטריצה</title>
<style>
:root {

html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", Arial, sans-serif; }

.logo { width: 30px; height: 30px; border-radius: 9px; background: conic-gradient(from 0deg, #ff3d3d, #ffb13d, #3ddc97, #3db4ff, #a23dff, #ff3d3d); flex: none; }

.pill.ok { color: var(--ok); }
.pill.busy { color: var(--acc); }
.pill.bad { color: var(--bad); border-color: var(--bad); cursor: pointer; }

input.saved { border-color: var(--ok) !important; box-shadow: 0 0 0 2px #3ddc9733; }
nav { display: flex; gap: 6px; overflow-x: auto; max-width: 860px; margin: 10px auto 0; padding-bottom: 10px; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { flex: none; background: var(--card); color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; font: inherit; cursor: pointer; }
nav button.on { background: linear-gradient(90deg, var(--acc), var(--acc2)); color: #fff; border-color: transparent; }
main { max-width: 860px; margin: 0 auto; padding: 4px 16px 80px; }
section { display: none; }
section.on { display: block; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin: 12px 0; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card > p.hint { margin: 0 0 8px; }
.hint { color: var(--dim); font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .lbl { flex: 1; min-width: 0; }
.row .lbl .hint { display: block; }
.row .ctl { flex: none; display: flex; align-items: center; gap: 8px; max-width: 60%; }
input, select, button, textarea { font: inherit; color: var(--text); }
select, input[type=text], input[type=password], input[type=number], input[type=time], input[type=datetime-local], textarea {
  background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; max-width: 100%;

input[type=number] { width: 90px; }
input[type=text], input[type=password] { width: 220px; }
input[type=range] { width: 170px; accent-color: var(--acc); }
input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 0; }
.sw { position: relative; width: 46px; height: 26px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; }
.sw span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .2s; cursor: pointer; }
.sw span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
.sw input:checked + span { background: var(--acc); }
.sw input:checked + span::after { right: 23px; }
.btn { background: var(--card2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 14px; cursor: pointer; }
.btn:hover { border-color: var(--dim); }
.btn.main { background: linear-gradient(90deg, var(--acc), var(--acc2)); border-color: transparent; color: #fff; font-weight: 600; }
.btn.bad { color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.big { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.big .btn { padding: 16px 10px; font-size: 16px; }
.party-btn { background: linear-gradient(90deg, #ff3d3d, #ffb13d, #3ddc97, #3db4ff, #a23dff); background-size: 300% 100%; animation: flow 4s linear infinite; color: #fff; font-weight: 700; border: 0; }
@keyframes flow { to { background-position: 300% 0; } }

.preview { background: #050608; border-radius: 12px; padding: 10px; border: 1px solid var(--line); }
canvas { width: 100%; display: block; image-rendering: pixelated; }
.status { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.stat { background: var(--card2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 16px; }
.stat small { color: var(--dim); }
.themes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.theme { width: 38px; height: 38px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
.theme.on { border-color: #fff; }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; direction: ltr; } /* cards sit where their corner is */

.corner { border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; cursor: pointer; background: var(--card2); }
.corner.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
.corner svg { width: 100%; height: 44px; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--card2); border: 1px solid var(--line); padding: 9px 18px; border-radius: 99px; transition: .25s; z-index: 9; }
.toast.on { transform: translateX(-50%) translateY(0); }

.ltr { direction: ltr; unicode-bidi: embed; }

.ble-box .flag-box .btn { padding: 10px; font-size: 15px; }
.ble-box .btn { width: 100%; padding: 14px; font-size: 17px; }
.game-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.game-card { background: var(--card2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--text); }
.game-card:active { border-color: var(--acc); }
.g-icon { font-size: 34px; line-height: 1.2; }
.g-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.g-head h2 { margin: 0; }
.g-score { font-size: 30px; }
.speed { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 2px; }
.lvs { display: flex; gap: 4px; direction: ltr; }
.lv { width: 38px; height: 38px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.lv.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #fff; border-color: transparent; }
.ramp { display: flex; align-items: center; gap: 6px; }
.g-over { color: var(--acc); min-height: 1.4em; margin: 4px 0; }
.pad { direction: ltr; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0 12px; user-select: none; -webkit-user-select: none; }
.dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 6px; }
.key { background: var(--card2); border: 1px solid var(--line); border-radius: 16px; font-size: 24px; color: var(--text); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.key.on { background: var(--acc); border-color: transparent; }

.key.a.on { filter: brightness(1.35); transform: scale(.95); }
.key.off { visibility: hidden; }
.big-logo { width: 72px; height: 72px; border-radius: 20px; }
.spin { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--acc); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 560px) {
  .row { flex-wrap: wrap; }
  .row .ctl { max-width: 100%; }
  input[type=range] { width: 150px; }
}

// ---------------- games ----------------
// The game runs on the clock; this is only the controller. A key sends "pressed", then "still held"
// every 0.6 s, then "released". Every answer carries the score.
let gameRefresh = async () => {};
tab("games", "משחקים", () => {
  const INFO = [
    { icon: "🐍", keys: ["up", "down", "left", "right"], help: "החצים מכוונים את הנחש. כל אוכל אדום מאריך אותו. הקצוות מחוברים: יוצאים מצד אחד ונכנסים מהשני.", touch: "לחצן 1 פונה שמאלה, לחצן 3 פונה ימינה." },
    { icon: "🦖", keys: ["up", "down", "a"], help: "A או ▲ קופץ מעל הקקטוסים. ▼ (להחזיק) מתכופף מתחת לציפורים.", touch: "לחצן 1 או 2 קופץ, לחצן 3 מתכופף." },
    { icon: "🐤", keys: ["a"], help: "כל לחיצה על A מעיפה את הציפור למעלה. עוברים בין הצינורות.", touch: "כל לחצן מעיף." },
    { icon: "🧱", keys: ["up", "down", "left", "a"], help: "החלקים נופלים מימין לשמאל. ▲▼ מזיזים, A מסובב, ◀ מפיל עד הסוף.", touch: "לחצן 1 מזיז למעלה, 3 למטה, 2 מסובב, נגיעה ארוכה ב-2 מפילה." },
  ];
  let listKey = "";
  const list = h("div", { class: "game-list" });
  const title = h("h2", {}), scoreEl = h("b", { class: "g-score" }), bestEl = h("span", { class: "hint" });
  const overEl = h("p", { class: "g-over" }), helpEl = h("p", { class: "hint" }), touchEl = h("p", { class: "hint" });
  const keys = {};
  // speed: level 1..5 where the game starts, and whether it speeds up while playing
  let curGame = -1;
  const speedSet = o => api("/api/action", Object.assign({ do: "gameSpeed", game: curGame }, o)).then(show).catch(() => toast("נכשל", true));
  const lvBtns = [1, 2, 3, 4, 5].map(n => h("button", { class: "lv", onclick: () => speedSet({ level: n }) }, String(n)));
  const rampIn = h("input", { type: "checkbox", onchange: () => speedSet({ ramp: rampIn.checked }) });
  const speedRow = h("div", { class: "speed" },
    h("span", { class: "hint" }, "מהירות"), h("div", { class: "lvs" }, ...lvBtns),
    h("label", { class: "ramp" }, h("label", { class: "sw" }, rampIn, h("span")), h("span", { class: "hint" }, "מאיץ בהדרגה")));
  async function send(k, s, r) {
    try { show(await api("/api/action", { do: "key", k, s, r: r || 0 }, true)); } catch (e) {}
  }
  function key(k, label, cls) {
    const b = h("button", { class: "key " + (cls || "") }, label);
    let t = null;
    b.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (t) return;
      b.classList.add("on"); send(k, 1);
      t = setInterval(() => send(k, 1, 1), 600);
    });
    const up = () => { if (!t) return; clearInterval(t); t = null; b.classList.remove("on"); send(k, 0); };
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(ev, up);
    b.addEventListener("contextmenu", e => e.preventDefault());
    return keys[k] = b;
  }
  const pad = h("div", { class: "pad" },
    h("div", { class: "dpad" }, h("span"), key("up", "▲"), h("span"), key("left", "◀"), h("span"), key("right", "▶"), h("span"), key("down", "▼"), h("span")),
    key("a", "A", "a"));
  const play = card("", null,
    h("div", { class: "g-head" }, title, scoreEl, bestEl), speedRow, overEl, pad, helpEl, touchEl,
    h("div", { class: "btns" }, h("button", { class: "btn", onclick: () => api("/api/action", { do: "gameStop" }).then(gameRefresh).catch(() => {}) }, "יציאה לשעון")));
  const pick = card("משחקים", "בחרו משחק. הוא רץ על השעון, והטלפון הוא השלט. את המהירות בוחרים בתוך המשחק (1 איטי, 5 מהיר), ו\"מאיץ בהדרגה\" מגביר אותה תוך כדי משחק. אפשר לשחק גם בלחצני המגע; נגיעה ארוכה בלחצן 1 יוצאת. אחרי דקה וחצי בלי לחיצות השעון חוזר לבד.", list);
  function show(st) {
    if (!st || !st.games) return;
    const lk = JSON.stringify(st.games);
    if (lk !== listKey) {
      listKey = lk;
      list.replaceChildren(...st.games.map((g, i) => h("button", {
        class: "game-card", onclick: () => api("/api/action", { do: "game", game: i }).then(gameRefresh).catch(() => toast("נכשל", true)),
      }, h("span", { class: "g-icon" }, (INFO[i] || {}).icon || "🎮"), h("b", {}, g.name),
         h("span", { class: "hint" }, "שיא: " + g.best + " · מהירות " + (g.level || 3) + (g.ramp === false ? "" : "↑")))));
    }
    const i = st.game, inf = INFO[i] || {};
    play.style.display = i >= 0 ? "" : "none";
    if (i < 0) return;
    const g = st.games[i] || {};
    curGame = i;
    lvBtns.forEach((b, n) => b.classList.toggle("on", n + 1 === (g.level || 3)));
    rampIn.checked = g.ramp !== false;
    title.textContent = (inf.icon || "") + " " + (g.name || "");
    scoreEl.textContent = st.gameScore;
    bestEl.textContent = "שיא: " + (g.best || 0);
    overEl.textContent = st.gameOver ? (st.gameScore > 0 && st.gameScore >= g.best ? "שיא חדש! " : "המשחק נגמר. ") + "לחיצה על מקש מתחילה מחדש." : "";
    helpEl.textContent = inf.help || "";
    touchEl.textContent = "בלחצני המגע: " + (inf.touch || "");
    for (const k in keys) keys[k].classList.toggle("off", !(inf.keys || []).includes(k));
  }
  gameRefresh = async () => show(await api("/api/game"));
  play.style.display = "none";
  return [play, pick];
});

  const file = h("input", { type: "file", accept: ".bin" });
  const prog = h("span", { class: "hint" });
  const restore = h("input", { type: "file", accept: ".json", style: "display:none", onchange: async () => {
    const f = restore.files[0]; if (!f) return;
    try { await save(JSON.parse(await f.text())); load(); } catch (e) { toast("קובץ לא תקין", true); }
  } });
  const info = h("div", { class: "status", id: "sysinfo" });
  return [
    card("שם השעון", "השם שמופיע בסריקת Bluetooth, ברשת ה-WiFi של השעון ובראש הדף.",
      text("name", "שם", "עד 29 אותיות באנגלית או 14 בעברית. ברשת ה-WiFi של השעון השם מתעדכן אחרי הפעלה מחדש.", 29, DEFAULT_NAME, nameValue)),
    card("מידע", null, info),
    BLE ? card("עדכון קושחה", "עדכון קושחה אפשרי רק דרך WiFi: התחברו לרשת של השעון (או לרשת הבית שלו) ופתחו את הדף שהוא מגיש, לשונית \"מערכת\".") :
    card("עדכון קושחה", "קובץ firmware.bin מתוך .pio/build/esp32doit-devkit-v1/",
      row("קובץ", null, file, h("button", { class: "btn main", onclick: () => {
        const f = file.files[0]; if (!f) return;
        const fd = new FormData(); fd.append("firmware", f);
        const x = new XMLHttpRequest();
        x.upload.onprogress = e => prog.textContent = Math.round(e.loaded * 100 / e.total) + "%";
        x.onload = () => { prog.textContent = x.status === 200 ? "הצליח, השעון מופעל מחדש…" : "נכשל: " + x.responseText; if (x.status === 200) setTimeout(() => location.reload(), 8000); };
        x.onerror = () => prog.textContent = "נכשל";
        x.open("POST", "/update"); x.send(fd);
      } }, "עדכן"), prog)),
    card("גיבוי", null,
      h("div", { class: "btns" },
        h("button", { class: "btn", onclick: async () => {
          try {
            const s = await api("/api/backup");
            const a = h("a", { href: URL.createObjectURL(new Blob([JSON.stringify(s, null, 2)], { type: "application/json" })), download: "matrix-clock-settings.json" });
            document.body.append(a); a.click(); a.remove();
          } catch (e) { toast("נכשל", true); }
        } }, "הורד גיבוי"),
        h("button", { class: "btn", onclick: () => restore.click() }, "שחזר מגיבוי"), restore),
      h("p", { class: "hint" }, "הגיבוי לא כולל סיסמאות.")),
    card("הפעלה מחדש", null,
      h("div", { class: "btns" },
        h("button", { class: "btn", onclick: () => act("reboot").then(() => toast("מופעל מחדש…")) }, "הפעל מחדש"),
        h("button", { class: "btn bad", onclick: () => { if (confirm("למחוק את כל ההגדרות?")) act("factory"); } }, "איפוס להגדרות היצרן"))),
  ];
});

// ---------------- preview + status ----------------

let frameBusy = false;
async function drawFrame() {
  const cv = $("cv");
  if (!cv || frameBusy || document.hidden || !$("tab-home").classList.contains("on") || (BLE && !Ble.isUp())) return;
  frameBusy = true;
  try {
    const f = await api("/api/frame");
    const P = 12, w = f.w;
    if (cv.width !== w * P) { cv.width = w * P; cv.height = 8 * P; }
    const g = cv.getContext("2d");
    g.fillStyle = "#050608"; g.fillRect(0, 0, cv.width, cv.height);
    for (let y = 0; y < 8; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 6, hx = f.px.substr(i, 6);
      const on = hx !== "000000";
      g.fillStyle = on ? "#" + hx : "#14171f";
      if (on) { g.shadowColor = "#" + hx; g.shadowBlur = 6; } else g.shadowBlur = 0;
      g.beginPath(); g.arc(x * P + P / 2, y * P + P / 2, P * 0.4, 0, 7); g.fill();
    }
  } catch (e) {}
  frameBusy = false;
}

function stat(v, label) { return h("div", { class: "stat" }, h("b", {}, v ?? "–"), h("small", {}, label)); }

async function poll() {
  if (BLE && !Ble.isUp()) return;
  // while playing only the small game state is fetched, so the keys keep the line to themselves
  if ($("tab-games").classList.contains("on")) return gameRefresh().catch(() => {});
  try { ST = await api("/api/status"); } catch (e) { $("pillNet").textContent = "אין חיבור"; $("pillNet").className = "pill"; return; }
  $("pillTime").textContent = ST.time || "--:--";
  $("pillNet").textContent = BLE ? "Bluetooth" : ST.wifi ? ST.ssid : ST.ap ? "רשת עצמאית" : "לא מחובר";
  $("pillNet").className = "pill" + (BLE || ST.wifi ? " ok" : "");
  const st = $("stats");
  if (st) st.replaceChildren(
    stat(ST.time, ST.weekday ? "יום " + ST.weekday : "שעה"),
    stat(ST.hebDate, "תאריך עברי"),
    stat(ST.gregDate, "תאריך לועזי"),
    stat(ST.temp != null ? ST.temp + "°" : null, "טמפרטורה"),
    ST.humidity != null ? stat(ST.humidity + "%", "לחות") : "",
    ST.pressure != null ? stat(Math.round(ST.pressure), "לחץ אוויר (מיליבר)") : "",
    stat(ST.mode === "party" ? "מסיבה 🎉" : ST.night ? "לילה 🌙" : "שעון", "מצב"));
  const pb = $("powerBtn"); if (pb) pb.textContent = ST.power ? "⏻ כיבוי" : "⏻ הדלקה";
  const party = $("partyBtn"); if (party) party.textContent = ST.mode === "party" ? "🕒 חזרה לשעון" : "🎉 מסיבה";
  const cn = $("clockNow"); if (cn) cn.textContent = ST.time ? ST.time + "  " + (ST.gregDate || "") : "לא מכוון";
  const ts = $("timeSrc"); if (ts) ts.textContent = (ST.ntp ? "מכוון מהאינטרנט" : ST.rtc ? "מה-DS3231" : "ה-DS3231 לא נמצא!") + (ST.ticker && ST.ticker.length ? " · " + ST.ticker.join(" · ") : "");
  const si = $("sysinfo"); if (si) si.replaceChildren(
    stat(ST.version, "גרסה"), stat(ST.ip, "כתובת"), stat(ST.rtc ? "תקין" : "לא נמצא", "DS3231"), stat(ST.sensor || "לא מחובר", "חיישן BME280"),
    stat(Math.round(ST.heap / 1024) + "K", "זיכרון פנוי"), stat(Math.floor(ST.uptime / 3600) + ":" + String(Math.floor(ST.uptime / 60) % 60).padStart(2, "0"), "זמן פעולה"),
    stat(ST.wifi ? ST.rssi + " dBm" : "–", "עוצמת אות"));
  for (const d of stDeps) d();
}

$("pillSave").addEventListener("click", retrySave);

async function load() {
  try { S = await api("/api/settings"); refresh(); } catch (e) { toast("אין חיבור לשעון", true); }
}

function build() {
  const nav = $("nav"), main = $("main");
  for (const t of TABS) {
    const sec = h("section", { id: "tab-" + t.id }, t.build()); // not the bare name: #home would scroll to it
    main.append(sec);
    const b = h("button", { onclick: () => showTab(t.id) }, t.title);
    b.dataset.id = t.id;
    nav.append(b);
  }
  function showTab(id) {
    for (const s of main.children) s.classList.toggle("on", s.id === "tab-" + id);
    for (const b of nav.children) b.classList.toggle("on", b.dataset.id === id);
    try { localStorage.setItem("tab", id); } catch (e) {}
    if (id === "games" && (!BLE || Ble.isUp())) gameRefresh().catch(() => {});
    window.scrollTo(0, 0);
  }
  let first = "home";
  try { first = location.hash.slice(1) || localStorage.getItem("tab") || "home"; } catch (e) {}
  showTab(TABS.some(t => t.id === first) ? first : "home");
}

build();
if (BLE) {
  // The installed app: connect screen, offline cache, manifest
  // The clock used last time is connected by itself; the scan button shows up only when that fails.
  // (Chrome opens its device list only after a tap, so the scan itself cannot pop up alone.)
  let saved = "";
  try { saved = localStorage.getItem("clockName") || ""; } catch (e) {}
  const msg = h("p", { class: "hint", id: "bleMsg" });
  const spin = h("div", { class: "spin" });
  const btn = h("button", { class: "btn main", onclick: () => Ble.connect() }, "חפש את השעון");
  const help = h("p", { class: "hint" }, "Chrome באנדרואיד. Bluetooth ומיקום (Location) צריכים להיות דלוקים. בחרו את השעון ברשימה.");
  // Pages cannot open chrome:// links, so the address is copied and pasted by hand.
  const FLAG_URL = "chrome://flags/#enable-web-bluetooth-new-permissions-backend";
  const copyBtn = h("button", { class: "btn", onclick: async () => {
    try { await navigator.clipboard.writeText(FLAG_URL); copyBtn.textContent = "✓ הועתק"; }
    catch { prompt("העתיקו את הכתובת:", FLAG_URL); }
  } }, "📋 העתק כתובת");
  const flag = h("div", { class: "flag-box", style: "display:none" },
    h("b", {}, "רוצים שהאפליקציה תתחבר לבד בפעם הבאה?"),
    h("ol", {},
      h("li", {}, "לחצו \"העתק כתובת\"."),
      h("li", {}, "פתחו לשונית חדשה ב-Chrome, הדביקו בשורת הכתובת ולחצו Enter."),
      h("li", {}, "ליד \"Web Bluetooth new permissions backend\" בחרו Enabled."),
      h("li", {}, "לחצו Relaunch למטה. Chrome ייפתח מחדש."),
      h("li", {}, "חזרו לכאן, לחצו \"חפש את השעון\" ובחרו אותו פעם אחת. מעכשיו החיבור אוטומטי.")),
    h("code", {}, FLAG_URL), copyBtn);
  const title = h("h2", {}, saved && saved !== DEFAULT_NAME ? saved : "שעון מטריצה");
  const ov = h("div", { class: "ble-ov" }, h("div", { class: "ble-box" },
    h("div", { class: "logo big-logo" }), title, spin, btn, msg, help, flag));
  document.body.append(ov);
  const scanMode = text => { spin.style.display = "none"; btn.style.display = ""; help.style.display = ""; if (text) msg.textContent = text; };
  let auto = false;
  Ble.onState((text, ok) => {
    ov.style.display = ok ? "none" : "flex";
    if (!auto || btn.style.display !== "none") msg.textContent = text || "";
    if (ok) { auto = false; scanMode(); load().then(poll); }
  });
  spin.style.display = "none";
  Ble.auto(saved).then(r => {
    if (r !== "on") { scanMode(); if (r === "off") flag.style.display = ""; return; }
    auto = true;
    btn.style.display = "none"; help.style.display = "none"; spin.style.display = "";
    msg.textContent = "מתחבר ל-" + (saved || "שעון") + "…";
    setTimeout(() => { if (!Ble.isUp()) scanMode("השעון לא נמצא. הוא דלוק וקרוב? אפשר גם לחפש אותו:"); }, 8000);
  });
  for (const [rel, href] of [["manifest", "manifest.webmanifest"], ["icon", "icon.svg"]]) document.head.append(h("link", { rel, href }));
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  setInterval(poll, 3000);
  setInterval(drawFrame, 800); // Bluetooth is slower: 3 KB per frame
} else {
  load().then(poll);
  setInterval(poll, 2500);
  setInterval(drawFrame, 200);
}
</script>
