<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0f14">
<title>שעון מטריצה</title>
<style>
:root {
  --bg: #0d0f14; --card: #161a22; --card2: #1d2230; --line: #2a3142; --text: #e9ecf3; --dim: #98a1b5;

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", Arial, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: linear-gradient(180deg, #0d0f14 70%, #0d0f14e0); padding: 12px 16px 0; }
.top { display: flex; align-items: center; gap: 10px; max-width: 860px; margin: 0 auto; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: conic-gradient(from 0deg, #ff3d3d, #ffb13d, #3ddc97, #3db4ff, #a23dff, #ff3d3d); flex: none; }
h1 { font-size: 18px; margin: 0; flex: 1; }
.pill { font-size: 12px; color: var(--dim); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.pill.ok { color: var(--ok); }
nav { display: flex; gap: 6px; overflow-x: auto; max-width: 860px; margin: 10px auto 0; padding-bottom: 10px; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { flex: none; background: var(--card); color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; font: inherit; cursor: pointer; }
nav button.on { background: linear-gradient(90deg, var(--acc), var(--acc2)); color: #fff; border-color: transparent; }
main { max-width: 860px; margin: 0 auto; padding: 4px 16px 80px; }
section { display: none; }
section.on { display: block; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin: 12px 0; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card > p.hint { margin: 0 0 8px; }
.hint { color: var(--dim); font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .lbl { flex: 1; min-width: 0; }
.row .lbl .hint { display: block; }
.row .ctl { flex: none; display: flex; align-items: center; gap: 8px; max-width: 60%; }
input, select, button, textarea { font: inherit; color: var(--text); }
select, input[type=text], input[type=password], input[type=number], input[type=time], input[type=datetime-local], textarea {
  background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; max-width: 100%;
}
input[type=number] { width: 90px; }
input[type=text], input[type=password] { width: 220px; }
input[type=range] { width: 170px; accent-color: var(--acc); }
input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 0; }
.sw { position: relative; width: 46px; height: 26px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; }
.sw span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .2s; cursor: pointer; }
.sw span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
.sw input:checked + span { background: var(--acc); }
.sw input:checked + span::after { right: 23px; }
.btn { background: var(--card2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 14px; cursor: pointer; }
.btn:hover { border-color: var(--dim); }
.btn.main { background: linear-gradient(90deg, var(--acc), var(--acc2)); border-color: transparent; color: #fff; font-weight: 600; }
.btn.bad { color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.big { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.big .btn { padding: 16px 10px; font-size: 16px; }
.party-btn { background: linear-gradient(90deg, #ff3d3d, #ffb13d, #3ddc97, #3db4ff, #a23dff); background-size: 300% 100%; animation: flow 4s linear infinite; color: #fff; font-weight: 700; border: 0; }
@keyframes flow { to { background-position: 300% 0; } }
@media (prefers-reduced-motion: reduce) { .party-btn { animation: none; } }
.preview { background: #050608; border-radius: 12px; padding: 10px; border: 1px solid var(--line); }
canvas { width: 100%; display: block; image-rendering: pixelated; }
.status { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.stat { background: var(--card2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 16px; }
.stat small { color: var(--dim); }
.themes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.theme { width: 38px; height: 38px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
.theme.on { border-color: #fff; }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; direction: ltr; } /* cards sit where their corner is */
.grid4 .hint { direction: rtl; }
.corner { border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; cursor: pointer; background: var(--card2); }
.corner.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
.corner svg { width: 100%; height: 44px; }
.steps { margin: 6px 0 0; padding-inline-start: 20px; color: var(--dim); font-size: 13px; }
.steps li { margin: 4px 0; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--card2); border: 1px solid var(--line); padding: 9px 18px; border-radius: 99px; transition: .25s; z-index: 9; }
.toast.on { transform: translateX(-50%) translateY(0); }
.toast.bad { color: var(--bad); }
.wifi-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.wifi-list button { text-align: right; }
.ltr { direction: ltr; unicode-bidi: embed; }
.ble-ov { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.ble-box { max-width: 360px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.ble-box h2 { margin: 0; }
.ble-box .btn { width: 100%; padding: 14px; font-size: 17px; }
.big-logo { width: 72px; height: 72px; border-radius: 20px; }
@media (max-width: 560px) {
  .row { flex-wrap: wrap; }
  .row .ctl { max-width: 100%; }
  input[type=range] { width: 150px; }
}

let S = {}, ST = {}, deps = [], stDeps = []; // deps follow the settings, stDeps the status

// ---------------- helpers ----------------

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const $ = id => document.getElementById(id);

function toast(msg, bad) {

// ---------------- transport: WiFi (page served by the clock) or Bluetooth (installed app) ----------------
// The clock serves this page over plain http, where Chrome allows no Bluetooth. The same page published
// over https (GitHub Pages) can be installed as an app and talks to the clock over Bluetooth LE instead.
const BLE = location.protocol === "https:" || new URLSearchParams(location.search).has("ble");
const APP_URL = "https://amir684.github.io/esp32-matrix-clock/";

const Ble = (() => {
  // See src/ble.h: packets of [id][flags][data], flags 1 = first, 2 = last.
  const SVC = "c1a70001-5e2d-4b8e-9f3a-6d0b8e1c7a10", REQ = "c1a70002-5e2d-4b8e-9f3a-6d0b8e1c7a10", RSP = "c1a70003-5e2d-4b8e-9f3a-6d0b8e1c7a10";
  const NAME = "MATRIX-CLOCK", CHUNK = 180;
  const enc = new TextEncoder(), dec = new TextDecoder();
  let dev = null, req = null, up = false, cur = null, queue = [], nextId = 1, onState = () => {};

  function onData(ev) {
    const dv = ev.target.value, v = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
    if (!cur || v.length < 2 || v[0] !== cur.id) return;
    if (v[1] & 1) cur.parts = [];
    if (cur.parts) cur.parts.push(v.slice(2));
    cur.touch = Date.now();
    if (v[1] & 2) finish(true);
  }
  function finish(ok) {
    const c = cur; cur = null;
    if (!c) return;
    clearInterval(c.timer);
    if (ok && c.parts) {
      const n = c.parts.reduce((a, p) => a + p.length, 0), all = new Uint8Array(n);
      let o = 0; for (const p of c.parts) { all.set(p, o); o += p.length; }
      const t = dec.decode(all), nl = t.indexOf("\n");
      c.resolve({ code: parseInt(t) || 500, body: nl < 0 ? "" : t.slice(nl + 1) });
    } else c.reject(new Error("BLE request failed"));
    pump();
  }
  async function pump() {
    if (cur || !queue.length || !up) return;
    cur = queue.shift();
    cur.id = nextId; nextId = nextId % 255 + 1; cur.touch = Date.now();
    cur.timer = setInterval(() => { if (cur && Date.now() - cur.touch > 10000) finish(false); }, 1000);
    const data = enc.encode(cur.method + " " + cur.path + "\n" + (cur.body || ""));
    try {
      for (let p = 0; p < data.length; p += CHUNK) {
        const part = data.subarray(p, p + CHUNK), m = new Uint8Array(part.length + 2);
        m[0] = cur.id; m[1] = (p === 0 ? 1 : 0) | (p + CHUNK >= data.length ? 2 : 0); m.set(part, 2);
        await req.writeValueWithResponse(m);
      }
    } catch (e) { finish(false); }
  }
  function request(method, path, body) {
    if (method === "GET") { const q = queue.find(x => x.method === "GET" && x.path === path); if (q) return q.promise; }
    const q = { method, path, body };
    q.promise = new Promise((res, rej) => { q.resolve = res; q.reject = rej; });
    queue.push(q); pump();
    return q.promise;
  }
  async function connectGatt() {
    onState("מתחבר…");
    const srv = await dev.gatt.connect(), svc = await srv.getPrimaryService(SVC);
    req = await svc.getCharacteristic(REQ);
    const rsp = await svc.getCharacteristic(RSP);
    rsp.addEventListener("characteristicvaluechanged", onData);
    await rsp.startNotifications();
    up = true; onState("", true); pump();
  }
  function useDev(d) { if (dev === d) return; dev = d; dev.addEventListener("gattserverdisconnected", lost); }
  let retrying = false;
  async function retry() {
    if (retrying) return; retrying = true;
    for (let i = 0; !up && dev; i++) {
      if (document.visibilityState === "visible") { try { await connectGatt(); break; } catch (e) { onState("מחפש את השעון…"); } }
      await new Promise(r => setTimeout(r, Math.min(2000 + i * 1000, 8000)));
    }
    retrying = false;
  }
  function lost() {
    up = false;
    if (cur) finish(false);
    for (const q of queue.splice(0)) q.reject(new Error("disconnected"));
    onState("החיבור נותק, מתחבר מחדש…"); retry();
  }
  async function connect() {
    try {
      if (!navigator.bluetooth) return onState("הדפדפן לא תומך ב-Bluetooth. צריך Chrome באנדרואיד.");
      if (!dev) useDev(await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }, { name: NAME }], optionalServices: [SVC] }));
      await connectGatt();
    } catch (e) { onState("החיבור נכשל: " + (e.message || e)); }
  }
  // A clock chosen before: connect without the button (Chrome's getDevices, not on every Android build)
  async function auto() {
    if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
    try {
      const ds = await navigator.bluetooth.getDevices(), d = ds.find(x => x.name === NAME) || ds[0];
      if (!d) return;
      useDev(d); onState("מתחבר אוטומטית…");
      if (d.watchAdvertisements) { d.addEventListener("advertisementreceived", () => { if (!up) retry(); }); try { await d.watchAdvertisements(); } catch (e) {} }
      retry();
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !up && dev) retry(); });
  return { request, connect, auto, isUp: () => up, onState: f => onState = f };
})();

async function api(path, body) {
  if (BLE) {
    const r = await Ble.request(body === undefined ? "GET" : "POST", path, body === undefined ? "" : JSON.stringify(body));
    if (r.code >= 400) throw new Error(r.body);
    return JSON.parse(r.body);
  }
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function save(obj) {
  try {
    S = await api("/api/settings", obj);
    refresh();
    toast("נשמר");
  } catch (e) { toast("השמירה נכשלה", true); }
}
async function act(what, extra) {
  try { await api("/api/action", Object.assign({ do: what }, extra || {})); }
  catch (e) { toast("נכשל", true); }
}

// Every control registers how to refresh itself from S
function refresh() { for (const d of deps) d(); }
function showIf(el, cond) { deps.push(() => el.style.display = cond() ? "" : "none"); return el; }

function card(title, hint, ...rows) { return h("div", { class: "card" }, h("h2", {}, title), hint ? h("p", { class: "hint" }, hint) : null, ...rows); }
function row(label, hint, ...ctl) {
  return h("div", { class: "row" }, h("div", { class: "lbl" }, label, hint ? h("span", { class: "hint" }, hint) : null), h("div", { class: "ctl" }, ...ctl));
}

function toggle(key, label, hint) {
  const i = h("input", { type: "checkbox", onchange: () => save({ [key]: i.checked }) });
  deps.push(() => i.checked = !!S[key]);
  return row(label, hint, h("label", { class: "sw" }, i, h("span")));
}
function itemToggle(key, label, hint) {
  const i = h("input", { type: "checkbox", onchange: () => save({ items: { [key]: i.checked } }) });
  deps.push(() => i.checked = !!(S.items && S.items[key]));
  return row(label, hint, h("label", { class: "sw" }, i, h("span")));
}
function select(key, label, hint, options, num = true) {
  const s = h("select", { onchange: () => save({ [key]: num ? +s.value : s.value }) }, options.map(([v, t]) => h("option", { value: v }, t)));
  deps.push(() => s.value = typeof S[key] === "boolean" ? (S[key] ? 1 : 0) : S[key]);
  return row(label, hint, s);
}
function range(key, label, hint, min, max, step, fmt) {
  const out = h("span", { class: "hint", style: "min-width:44px" });
  const i = h("input", { type: "range", min, max, step });
  const show = () => out.textContent = fmt ? fmt(+i.value) : i.value;
  let t;
  i.addEventListener("input", () => { show(); clearTimeout(t); t = setTimeout(() => save({ [key]: +i.value }), 250); });
  deps.push(() => { i.value = S[key]; show(); });
  return row(label, hint, i, out);
}
function number(key, label, hint, min, max, step, unit) {
  const i = h("input", { type: "number", min, max, step, onchange: () => save({ [key]: +i.value }) });
  deps.push(() => i.value = S[key]);
  return row(label, hint, i, unit ? h("span", { class: "hint" }, unit) : null);
}
function text(key, label, hint, max, ph) {
  const i = h("input", { type: "text", maxlength: max, placeholder: ph || "", onchange: () => save({ [key]: i.value }) });
  deps.push(() => i.value = S[key] || "");
  return row(label, hint, i);
}
function color(key, label, hint) {
  const i = h("input", { type: "color", onchange: () => save({ [key]: i.value }) });
  deps.push(() => i.value = (S[key] || "#ffffff").toLowerCase());
  return row(label, hint, i);
}
function timeOfDay(key, label) {
  const i = h("input", { type: "time", onchange: () => { const [a, b] = i.value.split(":").map(Number); save({ [key]: a * 60 + b }); } });
  deps.push(() => { const m = S[key] || 0; i.value = String(m / 60 | 0).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); });
  return row(label, null, i);
}
const pct = v => Math.max(1, Math.round(v * 100 / 255)) + "%";

        h("li", {}, "בדיקת מיפוי: צריך לראות אדום למעלה משמאל, ירוק למעלה מימין, כחול למטה משמאל וצהוב למטה מימין. נקודה לבנה רצה משמאל לימין בשורה העליונה, והמספר 123 קריא. אם התמונה הפוכה – השתמשו בהיפוכים."),
        h("li", {}, "בדיקת צבעים: אדום, ירוק, כחול ולבן. אם הצבעים מתחלפים – שנו את סדר הצבעים."))),
    card("חשמל", "הגבלת הזרם מורידה את הבהירות אוטומטית כשהתצוגה מבקשת יותר ממה שהספק נותן.",
      number("maxMilliamps", "זרם מקסימלי", "לפי ספק הכוח, עם מרווח ביטחון. 0 = ללא הגבלה.", 0, 40000, 100, "mA"),
      h("div", { class: "row" }, amps),
      toggle("btnActiveLow", "לחצנים פעילים בנמוך", "רק אם הלחמתם את הגשר B במודול TTP223"),
    ),
  ];
});

tab("net", "שעה ורשת", () => {
  const dt = h("input", { type: "datetime-local", step: 1 });
  const ssid = h("input", { type: "text", maxlength: 32, placeholder: "שם הרשת" });
  const pass = h("input", { type: "password", maxlength: 64, placeholder: "סיסמה" });

  const list = h("div", { class: "wifi-list" });
  const tzSel = h("select", { onchange: () => { if (tzSel.value !== "custom") save({ tz: tzSel.value }); else tzTxt.focus(); } },
    TZS.map(([n, v]) => h("option", { value: v }, n)), h("option", { value: "custom" }, "אחר (POSIX)"));
  const tzTxt = h("input", { type: "text", class: "ltr", maxlength: 47, onchange: () => save({ tz: tzTxt.value }) });
  deps.push(() => { ssid.value = S.wifiSsid || ""; tzTxt.value = S.tz; tzSel.value = TZS.some(t => t[1] === S.tz) ? S.tz : "custom"; });
  const timeNow = h("b", { id: "clockNow" }, "--");
  const src = h("span", { class: "hint", id: "timeSrc" });
  return [
    card("השעה", null,
      h("div", { class: "row" }, h("div", { class: "lbl" }, "השעה בשעון", h("span", { class: "hint" }, src)), h("div", { class: "ctl" }, timeNow)),
      row("כוון לפי המכשיר הזה", "לוקח את השעה מהטלפון או מהמחשב ושומר אותה ב-DS3231",
        h("button", { class: "btn main", onclick: async () => {
          try { await api("/api/time", { epoch: Math.floor(Date.now() / 1000) }); toast("השעה כוונה"); poll(); } catch (e) { toast("נכשל", true); }
        } }, "כוון עכשיו")),
      row("כיוון ידני", null, dt, h("button", { class: "btn", onclick: async () => {
        if (!dt.value) return;
        try { await api("/api/time", { epoch: Math.floor(new Date(dt.value).getTime() / 1000) }); toast("השעה כוונה"); poll(); } catch (e) { toast("נכשל", true); }
      } }, "קבע")),
      row("אזור זמן", "כולל מעבר אוטומטי לשעון קיץ", tzSel),
      showIf(row("אזור זמן (POSIX)", null, tzTxt), () => !TZS.some(t => t[1] === S.tz)),
    ),
    card("חיבור לרשת", "השעון עובד מצוין לבד עם ה-DS3231. חיבור לרשת הבית מוסיף כיוון שעה אוטומטי מהאינטרנט.",
      select("wifiMode", "מצב", null, [[0, "עצמאי – השעון פותח רשת משלו"], [1, "מחובר לרשת הבית"]]),
      showIf(h("div", {},
        row("רשת", null, ssid, h("button", { class: "btn", onclick: async () => {
          list.replaceChildren(h("span", { class: "hint" }, "מחפש…"));
          try {
            const nets = await api("/api/scan");
            list.replaceChildren(...nets.sort((a, b) => b.rssi - a.rssi).map(n =>
              h("button", { class: "btn", onclick: () => { ssid.value = n.ssid; list.replaceChildren(); pass.focus(); } }, `${n.ssid}  ${n.secure ? "🔒" : ""}  (${n.rssi})`)));
          } catch (e) { list.replaceChildren(h("span", { class: "hint" }, "החיפוש נכשל")); }
        } }, "חפש")),
        list,
        row("סיסמה", null, pass),
        row("", null, h("button", { class: "btn main", onclick: () => {
          const o = { wifiSsid: ssid.value }; if (pass.value) o.wifiPass = pass.value;
          save(o); toast("מתחבר… בדקו את הכתובת שתוצג על השעון");
        } }, "התחבר")),
        text("ntpServer", "שרת שעה", null, 47),
        text("hostname", "שם השעון ברשת", "אפשר לגלוש אל http://שם.local", 24),
      ), () => S.wifiMode === 1),
      row("סיסמה לרשת של השעון", "לרשת MATRIX-CLOCK. לפחות 8 תווים.", apPass, h("button", { class: "btn", onclick: () => {
        if (apPass.value && apPass.value.length < 8) return toast("לפחות 8 תווים", true);
        save({ apPass: apPass.value }); apPass.value = "";
      } }, "שמור")),
    ),
    card("Bluetooth", null,
      toggle("bleOn", "שליטה דרך Bluetooth", "לאפליקציה המותקנת בטלפון. השינוי נכנס לתוקף אחרי הפעלה מחדש."),
      BLE ? null : h("p", { class: "hint" }, "להתקנת האפליקציה: פתחו ב-Chrome באנדרואיד את ",
        h("a", { href: APP_URL, target: "_blank", style: "color:var(--acc)" }, APP_URL),
        " ובחרו \"התקן אפליקציה\" (או \"הוסף למסך הבית\")."),
    ),
  ];
});

tab("sys", "מערכת", () => {
  const file = h("input", { type: "file", accept: ".bin" });
  const prog = h("span", { class: "hint" });
  const restore = h("input", { type: "file", accept: ".json", style: "display:none", onchange: async () => {
    const f = restore.files[0]; if (!f) return;
    try { await save(JSON.parse(await f.text())); load(); } catch (e) { toast("קובץ לא תקין", true); }
  } });
  const info = h("div", { class: "status", id: "sysinfo" });
  return [
    card("מידע", null, info),
    BLE ? card("עדכון קושחה", "עדכון קושחה אפשרי רק דרך WiFi: התחברו לרשת של השעון (או לרשת הבית שלו) ופתחו את הדף שהוא מגיש, לשונית \"מערכת\".") :
    card("עדכון קושחה", "קובץ firmware.bin מתוך .pio/build/esp32doit-devkit-v1/",
      row("קובץ", null, file, h("button", { class: "btn main", onclick: () => {
        const f = file.files[0]; if (!f) return;
        const fd = new FormData(); fd.append("firmware", f);
        const x = new XMLHttpRequest();
        x.upload.onprogress = e => prog.textContent = Math.round(e.loaded * 100 / e.total) + "%";
        x.onload = () => { prog.textContent = x.status === 200 ? "הצליח, השעון מופעל מחדש…" : "נכשל: " + x.responseText; if (x.status === 200) setTimeout(() => location.reload(), 8000); };
        x.onerror = () => prog.textContent = "נכשל";
        x.open("POST", "/update"); x.send(fd);
      } }, "עדכן"), prog)),
    card("גיבוי", null,
      h("div", { class: "btns" },
        h("button", { class: "btn", onclick: async () => {
          try {
            const s = await api("/api/backup");
            const a = h("a", { href: URL.createObjectURL(new Blob([JSON.stringify(s, null, 2)], { type: "application/json" })), download: "matrix-clock-settings.json" });
            document.body.append(a); a.click(); a.remove();
          } catch (e) { toast("נכשל", true); }
        } }, "הורד גיבוי"),
        h("button", { class: "btn", onclick: () => restore.click() }, "שחזר מגיבוי"), restore),
      h("p", { class: "hint" }, "הגיבוי לא כולל סיסמאות.")),
    card("הפעלה מחדש", null,
      h("div", { class: "btns" },
        h("button", { class: "btn", onclick: () => act("reboot").then(() => toast("מופעל מחדש…")) }, "הפעל מחדש"),
        h("button", { class: "btn bad", onclick: () => { if (confirm("למחוק את כל ההגדרות?")) act("factory"); } }, "איפוס להגדרות היצרן"))),
  ];
});

// ---------------- preview + status ----------------

let frameBusy = false;
async function drawFrame() {
  const cv = $("cv");
  if (!cv || frameBusy || document.hidden || !$("tab-home").classList.contains("on") || (BLE && !Ble.isUp())) return;
  frameBusy = true;
  try {
    const f = await api("/api/frame");
    const P = 12, w = f.w;
    if (cv.width !== w * P) { cv.width = w * P; cv.height = 8 * P; }
    const g = cv.getContext("2d");
    g.fillStyle = "#050608"; g.fillRect(0, 0, cv.width, cv.height);
    for (let y = 0; y < 8; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 6, hx = f.px.substr(i, 6);
      const on = hx !== "000000";
      g.fillStyle = on ? "#" + hx : "#14171f";
      if (on) { g.shadowColor = "#" + hx; g.shadowBlur = 6; } else g.shadowBlur = 0;
      g.beginPath(); g.arc(x * P + P / 2, y * P + P / 2, P * 0.4, 0, 7); g.fill();
    }
  } catch (e) {}
  frameBusy = false;
}

function stat(v, label) { return h("div", { class: "stat" }, h("b", {}, v ?? "–"), h("small", {}, label)); }

async function poll() {
  if (BLE && !Ble.isUp()) return;
  try { ST = await api("/api/status"); } catch (e) { $("pillNet").textContent = "אין חיבור"; $("pillNet").className = "pill"; return; }
  $("pillTime").textContent = ST.time || "--:--";
  $("pillNet").textContent = BLE ? "Bluetooth" : ST.wifi ? ST.ssid : ST.ap ? "רשת עצמאית" : "לא מחובר";
  $("pillNet").className = "pill" + (BLE || ST.wifi ? " ok" : "");
  const st = $("stats");
  if (st) st.replaceChildren(
    stat(ST.time, ST.weekday ? "יום " + ST.weekday : "שעה"),
    stat(ST.hebDate, "תאריך עברי"),
    stat(ST.gregDate, "תאריך לועזי"),
    stat(ST.temp != null ? ST.temp + "°" : null, "טמפרטורה"),
    stat(ST.mode === "party" ? "מסיבה 🎉" : ST.night ? "לילה 🌙" : "שעון", "מצב"));
  const pb = $("powerBtn"); if (pb) pb.textContent = ST.power ? "⏻ כיבוי" : "⏻ הדלקה";
  const party = $("partyBtn"); if (party) party.textContent = ST.mode === "party" ? "🕒 חזרה לשעון" : "🎉 מסיבה";
  const cn = $("clockNow"); if (cn) cn.textContent = ST.time ? ST.time + "  " + (ST.gregDate || "") : "לא מכוון";
  const ts = $("timeSrc"); if (ts) ts.textContent = (ST.ntp ? "מכוון מהאינטרנט" : ST.rtc ? "מה-DS3231" : "ה-DS3231 לא נמצא!") + (ST.ticker && ST.ticker.length ? " · " + ST.ticker.join(" · ") : "");
  const si = $("sysinfo"); if (si) si.replaceChildren(
    stat(ST.version, "גרסה"), stat(ST.ip, "כתובת"), stat(ST.rtc ? "תקין" : "לא נמצא", "DS3231"),
    stat(Math.round(ST.heap / 1024) + "K", "זיכרון פנוי"), stat(Math.floor(ST.uptime / 3600) + ":" + String(Math.floor(ST.uptime / 60) % 60).padStart(2, "0"), "זמן פעולה"),
    stat(ST.wifi ? ST.rssi + " dBm" : "–", "עוצמת אות"));
  for (const d of stDeps) d();
}

async function load() {
  try { S = await api("/api/settings"); refresh(); } catch (e) { toast("אין חיבור לשעון", true); }
}

function build() {
  const nav = $("nav"), main = $("main");
  for (const t of TABS) {
    const sec = h("section", { id: "tab-" + t.id }, t.build()); // not the bare name: #home would scroll to it
    main.append(sec);
    const b = h("button", { onclick: () => showTab(t.id) }, t.title);
    b.dataset.id = t.id;
    nav.append(b);
  }
  function showTab(id) {
    for (const s of main.children) s.classList.toggle("on", s.id === "tab-" + id);
    for (const b of nav.children) b.classList.toggle("on", b.dataset.id === id);
    try { localStorage.setItem("tab", id); } catch (e) {}
    window.scrollTo(0, 0);
  }
  let first = "home";
  try { first = location.hash.slice(1) || localStorage.getItem("tab") || "home"; } catch (e) {}
  showTab(TABS.some(t => t.id === first) ? first : "home");
}

build();
if (BLE) {
  // The installed app: connect screen, offline cache, manifest
  const msg = h("p", { class: "hint", id: "bleMsg" });
  const btn = h("button", { class: "btn main", onclick: () => Ble.connect() }, "התחבר בבלוטות'");
  const ov = h("div", { class: "ble-ov" }, h("div", { class: "ble-box" },
    h("div", { class: "logo big-logo" }), h("h2", {}, "שעון מטריצה"), btn, msg,
    h("p", { class: "hint" }, "Chrome באנדרואיד. Bluetooth ומיקום (Location) צריכים להיות דלוקים. בחרו MATRIX-CLOCK ברשימה.")));
  document.body.append(ov);
  Ble.onState((text, ok) => {
    ov.style.display = ok ? "none" : "flex";
    msg.textContent = text || "";
    if (ok) load().then(poll);
  });
  Ble.auto();
  for (const [rel, href] of [["manifest", "manifest.webmanifest"], ["icon", "icon.svg"]]) document.head.append(h("link", { rel, href }));
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  setInterval(poll, 3000);
  setInterval(drawFrame, 800); // Bluetooth is slower: 3 KB per frame
} else {
  load().then(poll);
  setInterval(poll, 2500);
  setInterval(drawFrame, 200);
}
