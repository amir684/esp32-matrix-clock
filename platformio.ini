; ESP32 RGB matrix clock: 8x32 or 8x64 WS2812, DS3231, three TTP223 touch buttons.
; Build + upload:  pio run -t upload        Serial monitor: pio device monitor
; The web page (web/index.html) is packed into the firmware by tools/embed_web.py on every build.

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; 16MB flash: two 6.25MB app slots for OTA, 3.4MB for files (default_16MB.csv from the Arduino core).
; For a 4MB board use the env below.
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = default_16MB.csv
extra_scripts = pre:tools/embed_web.py
lib_deps =
    fastled/FastLED@^3.9.0
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@^2.3.0

; The same clock on an ESP32 with 4MB flash:  pio run -e esp32-4mb -t upload
; Two 1.875MB app slots for OTA (min_spiffs.csv). The firmware is about 1.5MB, so OTA updates still fit.
[env:esp32-4mb]
extends = env:esp32doit-devkit-v1
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
board_build.partitions = min_spiffs.csv

; LED test on an ESP32-C3 SuperMini (ledtest/main.cpp, not the clock):
; colour-order test, then lights the chain one LED at a time.  pio run -e c3-ledtest -t upload
; Data on GPIO4 (change LED_PIN below). Serial monitor: pio device monitor -e c3-ledtest
[env:c3-ledtest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../ledtest/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=4
    -DMAX_LEDS=512
lib_deps =
    fastled/FastLED@^3.9.0
